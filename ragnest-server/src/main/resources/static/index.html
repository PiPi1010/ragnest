<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RagNest 知识库管理</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
        .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
        h1 { font-size: 22px; margin-bottom: 4px; }
        .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .card h2 { font-size: 16px; margin-bottom: 14px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 14px; }
        .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .hidden { display: none !important; }
        input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; margin-bottom: 10px; font-family: inherit; }
        textarea { min-height: 80px; resize: vertical; }
        button { padding: 10px 18px; border: none; border-radius: 8px; background: var(--primary); color: #fff; font-size: 14px; cursor: pointer; }
        button:hover { opacity: 0.9; }
        button.secondary { background: #e5e7eb; color: var(--text); }
        button.danger { background: var(--danger); }
        .row { display: flex; gap: 8px; align-items: center; }
        .row button { margin-bottom: 10px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
        .list-item .info { flex: 1; }
        .list-item .name { font-weight: 600; font-size: 14px; }
        .list-item .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
        .msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; max-width: 85%; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
        .msg.user { background: var(--primary); color: #fff; margin-left: auto; }
        .msg.assistant { background: #f3f4f6; color: var(--text); }
        .chat-box { max-height: 480px; overflow-y: auto; padding: 8px; }
        .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
        .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>RagNest 知识库管理</h1>
    <div class="subtitle">企业级 RAG 知识库 · 多格式文档 · 智能问答</div>

    <!-- 登录区 -->
    <div class="card" id="login-card">
        <h2>登录</h2>
        <input type="text" id="login-username" placeholder="用户名" value="admin">
        <input type="password" id="login-password" placeholder="密码" value="admin123">
        <button onclick="login()">登录</button>
        <div class="error" id="login-error"></div>
        <div class="hint">默认账号 admin / admin123</div>
    </div>

    <!-- 主功能区（登录后显示） -->
    <div id="main-area" class="hidden">
        <div class="tabs">
            <div class="tab active" data-tab="kb" onclick="switchTab('kb')">知识库</div>
            <div class="tab" data-tab="doc" onclick="switchTab('doc')">文档</div>
            <div class="tab" data-tab="chat" onclick="switchTab('chat')">对话</div>
            <div class="tab" style="margin-left:auto" onclick="logout()">退出登录</div>
        </div>

        <!-- 知识库 -->
        <div class="card" id="tab-kb">
            <h2>知识库</h2>
            <input type="text" id="kb-name" placeholder="知识库名称">
            <input type="text" id="kb-desc" placeholder="描述（可选）">
            <button onclick="createKnowledgeBase()">新建知识库</button>
            <div class="hint" style="margin-bottom:12px">向量维度默认 1024（bge-m3）</div>
            <div id="kb-list"></div>
        </div>

        <!-- 文档 -->
        <div class="card hidden" id="tab-doc">
            <h2>文档管理</h2>
            <select id="doc-kb-select"></select>
            <input type="file" id="doc-file" multiple>
            <button onclick="uploadDocument()">上传文档</button>
            <div class="hint">支持 md / txt / pdf / docx / xlsx / csv</div>
            <div id="doc-list"></div>
        </div>

        <!-- 对话 -->
        <div class="card hidden" id="tab-chat">
            <h2>智能问答</h2>
            <div class="row">
                <select id="chat-kb-select" style="width:200px;margin-bottom:0">
                    <option value="">全部知识库</option>
                </select>
                <button class="secondary" onclick="newConversation()">新会话</button>
            </div>
            <div class="chat-box" id="chat-box"></div>
            <div class="row" style="margin-top:10px">
                <textarea id="chat-input" placeholder="输入你的问题..." style="margin-bottom:0;min-height:50px"></textarea>
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>
</div>

<script>
let token = localStorage.getItem('ragnest_token') || '';
let tenantId = localStorage.getItem('ragnest_tenant') || 'default';
let currentConversationId = null;

function authHeaders() {
    return {
        'Authorization': 'Bearer ' + token,
        'X-Tenant-Id': tenantId,
        'Content-Type': 'application/json'
    };
}

async function api(path, options = {}) {
    const res = await fetch(path, options);
    const data = await res.json();
    if (data.code !== 0) {
        throw new Error(data.message || '请求失败');
    }
    return data.data;
}

// === 登录 ===
async function login() {
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;
    try {
        const data = await api('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        token = data.token;
        tenantId = data.tenantId || 'default';
        localStorage.setItem('ragnest_token', token);
        localStorage.setItem('ragnest_tenant', tenantId);
        document.getElementById('login-error').textContent = '';
        showMain();
    } catch (e) {
        document.getElementById('login-error').textContent = e.message;
    }
}

function logout() {
    token = '';
    localStorage.removeItem('ragnest_token');
    document.getElementById('login-card').classList.remove('hidden');
    document.getElementById('main-area').classList.add('hidden');
}

function showMain() {
    document.getElementById('login-card').classList.add('hidden');
    document.getElementById('main-area').classList.remove('hidden');
    loadKnowledgeBases();
    loadChatKbOptions();
}

// === Tab 切换 ===
function switchTab(name) {
    document.querySelectorAll('.tab[data-tab]').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab[data-tab="${name}"]`).classList.add('active');
    ['kb', 'doc', 'chat'].forEach(n => document.getElementById(`tab-${n}`).classList.add('hidden'));
    document.getElementById(`tab-${name}`).classList.remove('hidden');
    if (name === 'kb') loadKnowledgeBases();
    if (name === 'doc') { loadDocKbOptions(); loadDocuments(); }
    if (name === 'chat') loadChatKbOptions();
}

// === 知识库 ===
async function createKnowledgeBase() {
    const name = document.getElementById('kb-name').value.trim();
    const description = document.getElementById('kb-desc').value.trim();
    if (!name) { alert('请输入知识库名称'); return; }
    try {
        await api('/api/knowledge-bases', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({ name, description, vectorDimension: 1024, embeddingModel: 'bge-m3' })
        });
        document.getElementById('kb-name').value = '';
        document.getElementById('kb-desc').value = '';
        loadKnowledgeBases();
    } catch (e) { alert(e.message); }
}

async function loadKnowledgeBases() {
    try {
        const list = await api('/api/knowledge-bases', { headers: authHeaders() });
        const el = document.getElementById('kb-list');
        if (!list || list.length === 0) {
            el.innerHTML = '<div class="hint">暂无知识库，先创建一个吧</div>';
            return;
        }
        el.innerHTML = list.map(kb => `
            <div class="list-item">
                <div class="info">
                    <div class="name">${kb.name}</div>
                    <div class="meta">ID: ${kb.id} · ${kb.description || '无描述'} · 向量维度 ${kb.vectorDimension || '-'}</div>
                </div>
                <button class="danger" onclick="deleteKnowledgeBase(${kb.id})">删除</button>
            </div>
        `).join('');
    } catch (e) { alert(e.message); }
}

async function deleteKnowledgeBase(id) {
    if (!confirm('确认删除该知识库？')) return;
    try {
        await api('/api/knowledge-bases/' + id, { method: 'DELETE', headers: authHeaders() });
        loadKnowledgeBases();
    } catch (e) { alert(e.message); }
}

// === 文档 ===
async function loadDocKbOptions() {
    const list = await api('/api/knowledge-bases', { headers: authHeaders() });
    const el = document.getElementById('doc-kb-select');
    el.innerHTML = list.map(kb => `<option value="${kb.id}">${kb.name}</option>`).join('');
}

async function uploadDocument() {
    const kbId = document.getElementById('doc-kb-select').value;
    const files = document.getElementById('doc-file').files;
    if (!kbId) { alert('请先选择知识库'); return; }
    if (!files.length) { alert('请选择文件'); return; }
    for (const file of files) {
        const fd = new FormData();
        fd.append('file', file);
        try {
            const res = await fetch(`/api/documents/upload?knowledgeBaseId=${kbId}`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'X-Tenant-Id': tenantId },
                body: fd
            });
            const data = await res.json();
            if (data.code !== 0) { alert(`${file.name}: ${data.message}`); }
        } catch (e) { alert(`${file.name}: ${e.message}`); }
    }
    document.getElementById('doc-file').value = '';
    loadDocuments();
}

async function loadDocuments() {
    const kbId = document.getElementById('doc-kb-select').value;
    if (!kbId) return;
    try {
        const list = await api('/api/documents?knowledgeBaseId=' + kbId, { headers: authHeaders() });
        const el = document.getElementById('doc-list');
        if (!list || list.length === 0) {
            el.innerHTML = '<div class="hint">暂无文档</div>';
            return;
        }
        el.innerHTML = list.map(d => `
            <div class="list-item">
                <div class="info">
                    <div class="name">${d.name}</div>
                    <div class="meta">${d.fileType} · ${d.chunkCount || 0} 个切片</div>
                </div>
                <button class="danger" onclick="deleteDocument(${d.id})">删除</button>
            </div>
        `).join('');
    } catch (e) { alert(e.message); }
}

async function deleteDocument(id) {
    if (!confirm('确认删除该文档？')) return;
    try {
        await api('/api/documents/' + id, { method: 'DELETE', headers: authHeaders() });
        loadDocuments();
    } catch (e) { alert(e.message); }
}

// === 对话 ===
async function loadChatKbOptions() {
    const list = await api('/api/knowledge-bases', { headers: authHeaders() });
    const el = document.getElementById('chat-kb-select');
    el.innerHTML = '<option value="">全部知识库</option>' + list.map(kb => `<option value="${kb.id}">${kb.name}</option>`).join('');
}

function newConversation() {
    currentConversationId = null;
    document.getElementById('chat-box').innerHTML = '<div class="hint">新会话，开始提问吧</div>';
}

async function sendMessage() {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (!message) return;
    input.value = '';

    const box = document.getElementById('chat-box');
    box.insertAdjacentHTML('beforeend', `<div class="msg user">${escapeHtml(message)}</div>`);

    const kbId = document.getElementById('chat-kb-select').value;
    const body = { message };
    if (kbId) body.knowledgeBaseId = Number(kbId);
    if (currentConversationId) body.conversationId = currentConversationId;

    try {
        const data = await api('/api/conversations/chat', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify(body)
        });
        if (data.conversationId) currentConversationId = data.conversationId;
        box.insertAdjacentHTML('beforeend', `<div class="msg assistant">${escapeHtml(data.content)}</div>`);
    } catch (e) {
        box.insertAdjacentHTML('beforeend', `<div class="msg assistant error">错误：${escapeHtml(e.message)}</div>`);
    }
    box.scrollTop = box.scrollHeight;
}

function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 页面加载时若已有 token 则直接进入主界面
if (token) { showMain(); }
</script>
</body>
</html>
