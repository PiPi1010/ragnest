# 生产环境配置
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ragnest}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # 生产模型（通义千问，通过 OpenAI 兼容接口）
  ai:
    openai:
      base-url: ${OPENAI_BASE_URL}
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${CHAT_MODEL:qwen-plus}
      embedding:
        model: ${EMBEDDING_MODEL:text-embedding-v3}

# JWT 配置（生产密钥务必通过环境变量注入）
ragnest:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  vector:
    dimensions: ${VECTOR_DIMENSIONS:1024}
    table-name: vector_store

logging:
  level:
    com.ragnest: info
